<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>书签管家 · 新标签页</title>
  <link rel="stylesheet" href="css/popup.css" />
  <link rel="stylesheet" href="css/newtab.css" />
</head>
<body class="nt-body">
  <div class="nt-wrap">
    <!-- 顶栏：品牌 + 打开管理面板 -->
    <header class="nt-top">
      <div class="nt-brand">
        <span class="brand-icon">🐾</span>
        <span>书签管家</span>
      </div>
      <div class="nt-top-actions">
        <span class="nt-count" id="ntCount"></span>
        <a class="nt-source-link" href="https://github.com/cfdywds/chrome-bookmark-manager" target="_blank" rel="noopener noreferrer" title="查看开源仓库" aria-label="查看开源仓库">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span>开源仓库</span>
        </a>
        <button id="ntOpenPanel" class="btn small ghost">⚙️ 打开管理面板</button>
      </div>
    </header>

    <!-- 搜索 -->
    <div class="nt-search">
      <svg class="nt-search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="ntSearch" type="text" placeholder="搜索标题、网址、域名、标签" autocomplete="off" spellcheck="false" />
      <button class="help-dot" type="button" data-tip="多个词会同时匹配；以 #标签名开头可按标签精确筛选。" aria-label="多个词会同时匹配；以标签名开头可按标签精确筛选。">?</button>
      <button id="ntClear" class="nt-clear hidden" title="清空">✕</button>
    </div>

    <!-- 标签筛选条 -->
    <div class="nt-tags" id="ntTags"></div>

    <!-- 书签卡片网格 -->
    <main class="nt-main">
      <div class="nt-grid" id="ntGrid"></div>
      <div class="nt-more" id="ntMore"></div>
      <div class="nt-empty hidden" id="ntEmpty">
        <div class="nt-empty-icon">🔍</div>
        <div class="nt-empty-title" id="ntEmptyTitle">没有匹配的书签</div>
        <div class="nt-empty-desc" id="ntEmptyDesc">换个关键词，或清空筛选条件</div>
      </div>
    </main>
  </div>

  <script src="js/lib.js"></script>
  <script src="js/analyzer.js"></script>
  <script src="js/newtab.js"></script>
</body>
</html>
