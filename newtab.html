<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>书签管家 · 新标签页</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/popup.css" />
    <link rel="stylesheet" href="css/newtab.css" />
  </head>
  <body class="nt-body">
    <div class="nt-wrap">
      <!-- 顶栏：品牌 + 打开管理面板 -->
      <header class="nt-top">
        <div class="nt-brand">
          <img class="brand-icon" src="icons/icon48.png" alt="" width="22" height="22" />
          <span>书签管家</span>
          <span class="nt-version" id="ntVersion" data-tip="扩展版本号"></span>
        </div>
        <div class="nt-top-actions">
          <span class="nt-count" id="ntCount"></span>
          <a
            class="nt-source-link"
            href="https://github.com/cfdywds/chrome-bookmark-manager"
            target="_blank"
            rel="noopener noreferrer"
            data-tip="查看开源仓库"
            aria-label="查看开源仓库"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <use href="icons/sprite.svg#i-external" />
            </svg>
            <span>开源仓库</span>
          </a>
          <button id="ntOpenPanel" class="btn small ghost">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="ico ico-sm"
            >
              <use href="icons/sprite.svg#i-gear" />
            </svg>
            打开管理面板
          </button>
          <div class="nt-view-toggle" role="group" aria-label="视图切换">
            <button
              id="ntViewGrid"
              class="nt-view-btn active"
              type="button"
              data-tip="卡片视图"
              aria-label="卡片视图"
              aria-pressed="true"
            >
              <svg class="ico ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <use href="icons/sprite.svg#i-grid" />
              </svg>
            </button>
            <button
              id="ntViewList"
              class="nt-view-btn"
              type="button"
              data-tip="紧凑列表视图"
              aria-label="紧凑列表视图"
              aria-pressed="false"
            >
              <svg class="ico ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <use href="icons/sprite.svg#i-list" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <!-- 搜索（滚动时悬浮固定在最顶部） -->
      <div class="nt-search search-box lg" id="ntSearchBar">
        <svg
          class="nt-search-ico"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <use href="icons/sprite.svg#i-search" />
        </svg>
        <input
          id="ntSearch"
          type="text"
          placeholder="搜索标题、网址、域名、标签"
          autocomplete="off"
          spellcheck="false"
        />
        <button
          class="help-dot"
          type="button"
          data-tip="多个词会同时匹配；以 #标签名开头可按标签精确筛选。"
          aria-label="多个词会同时匹配；以标签名开头可按标签精确筛选。"
        >
          ?
        </button>
        <span id="ntResultCount" class="nt-result-count hidden"></span>
        <button id="ntClear" class="nt-clear hidden" data-tip="清空搜索" aria-label="清空搜索">✕</button>
      </div>

      <!-- 文件夹筛选（与标签筛选条并存） -->
      <div class="nt-filter-bar">
        <div class="nt-folder-filter is-loading" id="ntFolderFilter" aria-busy="true">
          <span class="nt-folder-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <use href="icons/sprite.svg#i-folder" />
            </svg>
          </span>
          <span class="nt-folder-heading">
            <span class="nt-folder-label">文件夹</span>
            <span class="nt-folder-summary" id="ntFolderSummary">正在加载目录…</span>
          </span>
          <span class="nt-folder-select-wrap">
            <button
              class="nt-folder-trigger"
              id="ntFolderTrigger"
              type="button"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="ntFolderMenu"
              aria-label="按文件夹筛选书签"
            >
              <span id="ntFolderValue">正在加载目录…</span>
              <span class="nt-folder-chevron" aria-hidden="true">⌄</span>
            </button>
            <div
              class="nt-folder-menu"
              id="ntFolderMenu"
              role="listbox"
              aria-label="文件夹目录"
              hidden
            ></div>
            <select id="ntFolder" class="nt-folder-native" tabindex="-1" aria-hidden="true">
              <option value="" disabled selected>正在加载目录…</option>
            </select>
          </span>
        </div>
        <span class="nt-folder-tree-status" id="ntFolderTreeStatus" aria-live="polite"></span>
      </div>

      <!-- 标签筛选条 -->
      <div class="nt-tags" id="ntTags"></div>

      <!-- 书签卡片网格 -->
      <main class="nt-main">
        <!-- 首屏骨架屏：初始化期间展示，首次渲染后隐藏 -->
        <div class="nt-loading" id="ntLoading" aria-hidden="true">
          <div class="nt-skeleton"></div>
          <div class="nt-skeleton"></div>
          <div class="nt-skeleton"></div>
          <div class="nt-skeleton"></div>
          <div class="nt-skeleton"></div>
          <div class="nt-skeleton"></div>
          <div class="nt-skeleton"></div>
          <div class="nt-skeleton"></div>
        </div>
        <div class="nt-grid" id="ntGrid" role="listbox" aria-label="书签列表" tabindex="0"></div>
        <div class="nt-more" id="ntMore"></div>
        <div class="nt-empty hidden" id="ntEmpty">
          <div class="nt-empty-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="44"
              height="44"
              aria-hidden="true"
            >
              <use href="icons/sprite.svg#i-search" />
            </svg>
          </div>
          <div class="nt-empty-title" id="ntEmptyTitle">没有匹配的书签</div>
          <div class="nt-empty-desc" id="ntEmptyDesc">换个关键词，或清空筛选条件</div>
        </div>
      </main>
    </div>

    <!-- 轻量确认弹层（删除等危险操作） -->
    <div
      id="ntConfirmWrap"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="ntConfirmTitle"
    >
      <div class="modal-card">
        <div class="modal-title" id="ntConfirmTitle">确认操作？</div>
        <div class="modal-msg" id="ntConfirmMsg"></div>
        <div class="modal-actions">
          <button id="ntConfirmNo" class="btn ghost">取消</button>
          <button id="ntConfirmYes" class="btn danger">确认</button>
        </div>
      </div>
    </div>

    <script src="js/lib.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/analyzer.js"></script>
    <script src="js/newtab.js"></script>
  </body>
</html>
