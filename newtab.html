<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>书签管家 · 新标签页</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/popup.css" />
    <link rel="stylesheet" href="css/newtab.css" />
  </head>
  <body class="nt-body">
    <div class="nt-wrap">
      <!-- 吸顶容器：logo / 搜索 / 筛选 / 标签固定在顶部，仅下方书签列表滚动 -->
      <div class="nt-head" id="ntHead">
        <!-- 顶栏：品牌 + 打开管理面板 -->
        <header class="nt-top">
          <div class="nt-brand">
            <img class="brand-icon" src="icons/icon48.png" alt="" width="22" height="22" />
            <span>书签管家</span>
            <span class="nt-version" id="ntVersion" data-tip="扩展版本号"></span>
          </div>
          <div class="nt-top-actions">
            <span class="nt-count" id="ntCount"></span>
            <a
              class="nt-source-link"
              href="https://github.com/cfdywds/chrome-bookmark-manager"
              target="_blank"
              rel="noopener noreferrer"
              data-tip="查看开源仓库"
              aria-label="查看开源仓库"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <use href="icons/sprite.svg#i-external" />
              </svg>
              <span>开源仓库</span>
            </a>
            <button id="ntOpenPanel" class="btn small ghost">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="ico ico-sm"
              >
                <use href="icons/sprite.svg#i-gear" />
              </svg>
              打开管理面板
            </button>
            <div class="nt-view-toggle" role="group" aria-label="视图切换">
              <button
                id="ntViewGrid"
                class="nt-view-btn active"
                type="button"
                data-tip="卡片视图"
                aria-label="卡片视图"
                aria-pressed="true"
              >
                <svg class="ico ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <use href="icons/sprite.svg#i-grid" />
                </svg>
              </button>
              <button
                id="ntViewList"
                class="nt-view-btn"
                type="button"
                data-tip="紧凑列表视图"
                aria-label="紧凑列表视图"
                aria-pressed="false"
              >
                <svg class="ico ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <use href="icons/sprite.svg#i-list" />
                </svg>
              </button>
            </div>
          </div>
        </header>

        <!-- 搜索（随吸顶头部固定在顶部） -->
        <div class="nt-search search-box lg" id="ntSearchBar">
          <svg
            class="nt-search-ico"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <use href="icons/sprite.svg#i-search" />
          </svg>
          <input
            id="ntSearch"
            type="text"
            placeholder="搜索标题、网址、域名、标签"
            autocomplete="off"
            spellcheck="false"
          />
          <button
            class="help-dot"
            type="button"
            data-tip="多个词会同时匹配；以 #标签名开头可按标签精确筛选。"
            aria-label="多个词会同时匹配；以标签名开头可按标签精确筛选。"
          >
            ?
          </button>
          <button
            id="ntFilterToggle"
            class="nt-filter-toggle"
            type="button"
            aria-expanded="false"
            aria-haspopup="dialog"
            aria-controls="ntFolderModal"
            aria-pressed="false"
            data-tip="按文件夹筛选"
            aria-label="按文件夹筛选"
          >
            <svg class="ico ico-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <use href="icons/sprite.svg#i-folder" />
            </svg>
            <span>筛选</span>
          </button>
          <span id="ntResultCount" class="nt-result-count hidden"></span>
          <button
            id="ntFilterClear"
            class="nt-filter-clear hidden"
            type="button"
            data-tip="清除搜索、标签与文件夹筛选"
            aria-label="清除搜索、标签与文件夹筛选"
          >
            清除筛选
          </button>
          <button id="ntClear" class="nt-clear hidden" data-tip="清空搜索" aria-label="清空搜索">✕</button>
        </div>

        <!-- 标签筛选条 -->
        <div class="nt-tags" id="ntTags"></div>
      </div>

      <!-- 书签卡片网格 -->
      <main class="nt-main">
        <!-- 首屏骨架屏：初始化期间展示，首次渲染后隐藏 -->
        <div class="nt-loading" id="ntLoading" aria-hidden="true">
          <div class="nt-skeleton"></div>
          <div class="nt-skeleton"></div>
          <div class="nt-skeleton"></div>
          <div class="nt-skeleton"></div>
          <div class="nt-skeleton"></div>
          <div class="nt-skeleton"></div>
          <div class="nt-skeleton"></div>
          <div class="nt-skeleton"></div>
        </div>
        <div class="nt-grid" id="ntGrid" role="listbox" aria-label="书签列表" tabindex="0"></div>
        <div class="nt-more" id="ntMore"></div>
        <div class="nt-empty hidden" id="ntEmpty">
          <div class="nt-empty-icon">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="44"
              height="44"
              aria-hidden="true"
            >
              <use href="icons/sprite.svg#i-search" />
            </svg>
          </div>
          <div class="nt-empty-title" id="ntEmptyTitle">没有匹配的书签</div>
          <div class="nt-empty-desc" id="ntEmptyDesc">换个关键词，或清空筛选条件</div>
        </div>
      </main>
    </div>

    <!-- 文件夹筛选弹窗：入口是搜索框里的「筛选」，卡片与列表视图共用 -->
    <div
      id="ntFolderModal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="ntFolderModalTitle"
    >
      <div class="modal-card nt-folder-modal">
        <div class="modal-title nt-folder-modal-title" id="ntFolderModalTitle">
          <svg
            class="ico ico-sm"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <use href="icons/sprite.svg#i-folder" />
          </svg>
          按文件夹筛选
        </div>
        <div class="nt-folder-modal-summary" id="ntFolderSummary" aria-live="polite">正在加载目录…</div>
        <div class="nt-folder-options" id="ntFolderMenu" role="listbox" aria-label="文件夹目录"></div>
        <div class="modal-actions">
          <button id="ntFolderClear" class="btn ghost" type="button">全部文件夹</button>
          <button id="ntFolderClose" class="btn primary" type="button">完成</button>
        </div>
      </div>
    </div>

    <!-- 轻量确认弹层（删除等危险操作） -->
    <div
      id="ntConfirmWrap"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="ntConfirmTitle"
    >
      <div class="modal-card">
        <div class="modal-title" id="ntConfirmTitle">确认操作？</div>
        <div class="modal-msg" id="ntConfirmMsg"></div>
        <div class="modal-actions">
          <button id="ntConfirmNo" class="btn ghost">取消</button>
          <button id="ntConfirmYes" class="btn danger">确认</button>
        </div>
      </div>
    </div>

    <script src="js/lib.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/analyzer.js"></script>
    <script src="js/newtab.js"></script>
  </body>
</html>
